# Copy to models.yaml. Keys/URLs are read from .env via *_env fields.
#
# Rough cost: calls ≈ (#models) × (#tasks) × (--limit)

models:
  # Default path: memtensor Chat Completions (https://api-int.memtensor.cn/...)
  - name: gpt-memtensor
    backend: memtensor
    base_url_env: MODEL_gpt_memtensor_URL
    api_key_env: MODEL_gpt_memtensor_KEY
    model_env: GPT_API_MODEL
    model: gpt-4o-2024-11-20
    timeout_s: 120

  # Add more memtensor models by changing model id (same URL/KEY):
